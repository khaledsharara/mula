name: Support my bank
description: Ask for (or offer to add) support for another bank's SMS alerts.
labels: [bank]
body:
  - type: markdown
    attributes:
      value: |
        Adding a bank is one file and some made-up sample messages: see [docs/adding-a-bank.md](https://github.com/khaledsharara/mula/blob/main/docs/adding-a-bank.md). A pull request is the fastest way, but an issue with good samples helps too.

        **Never paste real messages.** Keep the bank's exact wording and spacing, and replace every amount, balance, card or account digit, name, branch and reference number with a made-up one.
  - type: input
    id: bank
    attributes:
      label: Bank and country
      placeholder: Example Bank, Egypt
    validations:
      required: true
  - type: input
    id: senders
    attributes:
      label: SMS sender names
      description: As your phone shows them, for example EXAMPLEBANK.
  - type: textarea
    id: samples
    attributes:
      label: Sample messages (made up)
      description: One per kind of message (card payment, transfer out and in, ATM, deposit, refund), plus the ones Mula should skip (codes, declines, offers).
      render: text
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Can you help?
      options:
        - I'll open a pull request
        - I can test a build
        - Just asking
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Every sample is made up. No real amounts, balances, digits, names, branches or reference numbers.
          required: true
